name: Course checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install light starter dependencies
        run: python -m pip install openpyxl==3.1.5 Flask==3.1.3 numpy==2.5.4
      - name: Check links, archives and starters
        run: python tools/check_course.py
      - name: Check reference solutions without models
        run: cd tools && python check_solutions.py
